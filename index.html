    function setLang(lang){
      localStorage.setItem('reinjoost_lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        el.textContent = translations[lang][el.dataset.i18n];
      });
      const search = document.getElementById('searchInput');
      if(search) search.placeholder = translations[lang].search;
      document.querySelectorAll('[data-i18n-title]').forEach(el=>{
        el.title = translations[lang][el.dataset.i18nTitle];
      });
      document.querySelectorAll('[data-i18n-aria]').forEach(el=>{
        el.setAttribute('aria-label', translations[lang][el.dataset.i18nAria]);
      });
      document.querySelectorAll('.lang-switch button').forEach(btn=>{
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.documentElement.lang = lang;
      if(typeof refreshCatalogLang === 'function') refreshCatalogLang(lang);
    }

    document.querySelectorAll('.lang-switch button').forEach(btn=>{
      btn.addEventListener('click', ()=> setLang(btn.dataset.lang));
    });

          {q:"How to properly plant hybrid tea roses in spring?", a:"Plant roses in spring once the soil has warmed to +10°C, in a sunny spot with no standing water. The planting hole should be spacious enough, and the root collar is buried about 3–5 cm deep after planting."},
          {q:"How to cover roses for winter?", a:"Before winter, roses are pruned, mounded with dry soil or compost, and covered with an air-dry shelter. It's important not to rush the covering: it's done after steady frosts set in (for example, early December), so the plants don't rot from dampness."},
          {q:"What soil do hybrid tea roses need?", a:"Roses prefer fertile, loose, well-drained soil with a neutral or slightly acidic reaction. Special rose soil mixed with compost and loosening material can be used for planting."},
          {q:"Do roses tolerate shade, and how to care for them?", a:"Hybrid tea roses do best in a sunny spot: in shade they bloom worse and get sick more often. Care includes regular watering, feeding, removing spent blooms, and pruning; when choosing seedlings, look for a healthy root system and well-developed shoots."}
        ],
        stepsTitle: "How to prune hybrid tea roses in autumn",
        steps: [
          "Remove all leaves from the bush — especially if they have spots or signs of disease.",
          "Cut out dry, diseased, weak and thin shoots.",
          "Shorten the remaining strong shoots to about 30–50 cm, leaving 4–6 well-developed buds.",
          "Make the cut at an angle, about 0.5–1 cm above an outward-facing bud.",
          "After pruning, mound the base of the bush with dry soil or compost 15–20 cm high, then cover it."
        ],
        note: "Important: don't prune roses too hard too early while it's still warm. Autumn pruning should be done closer to steady frosts (e.g., 15.10–15.11), otherwise new buds may wake up after pruning. Also: if you want the bush to be lush with plenty of blooms next summer, do additional shaping pruning in spring, and sanitary, moderate shortening in autumn."
      }
    };

    function renderFaq(lang){
      const data = FAQ_DATA[lang];
      const box = document.getElementById('faqContent');
      let html = '';
      data.qa.forEach(item => {
        html += `<div class="faq-item"><div class="faq-question">${item.q}</div><div class="faq-answer">${item.a}</div></div>`;
      });
      html += `<div class="faq-section-title">${data.stepsTitle}</div>`;
      html += '<ol class="faq-steps">';
      data.steps.forEach(s => { html += `<li>${s}</li>`; });
      html += '</ol>';
      html += `<div class="faq-note">${data.note}</div>`;
      box.innerHTML = html;
    }

    const burgerBtnEl = document.getElementById('burgerBtn');
    const burgerMenuEl = document.getElementById('burgerMenu');
    burgerBtnEl.addEventListener('click', (e)=>{
      e.stopPropagation();
      burgerMenuEl.classList.toggle('open');
    });
    document.addEventListener('click', (e)=>{
      if(!burgerMenuEl.contains(e.target) && e.target !== burgerBtnEl){
        burgerMenuEl.classList.remove('open');
      }
    });

    const modalOverlayEl = document.getElementById('modalOverlay');
    const modalAboutBox = document.getElementById('modalAbout');
    const modalVisitBox = document.getElementById('modalVisit');
    const modalFaqBox = document.getElementById('modalFaq');
    const modalPartnersBox = document.getElementById('modalPartners');
    const modals = { about: modalAboutBox, visit: modalVisitBox, faq: modalFaqBox, partners: modalPartnersBox };

    const PARTNERS_TEXT = {
      et: {
        p1: "Pakume koostööd aednikele, maastikukujundajatele, väikestele aiakeskustele ja suvilaühistutele: hulgihinnad, järjepidevad tarned ja isiklik nõustamine sortide valikul.",
        p2: "Kui soovite koostööd teha, võtke meiega ühendust:",
      },
      ru: {
        p1: "Предлагаем сотрудничество садовникам, ландшафтным дизайнерам, небольшим садовым центрам и садоводческим товариществам: оптовые цены, стабильные поставки и личная консультация по подбору сортов.",
        p2: "Если хотите сотрудничать — свяжитесь с нами:",
      },
      en: {
        p1: "We offer cooperation to gardeners, landscape designers, small garden centres and dacha communities: wholesale pricing, reliable supply and personal advice on choosing varieties.",
        p2: "If you'd like to cooperate, get in touch with us:",
      },
    };
    function renderPartners(lang){
      const t = PARTNERS_TEXT[lang];
      document.getElementById('partnersContent').innerHTML = `
        <p style="margin-bottom:14px;">${t.p1}</p>
        <p style="margin-bottom:10px;">${t.p2}</p>
        <p style="font-weight:600;color:var(--green-dark);">
          <a href="mailto:reinjoost@gmail.com" style="color:inherit;">reinjoost@gmail.com</a><br>
          <a href="tel:5072436" style="color:inherit;">5072436</a>
        </p>
      `;
    }

    function openModal(name){
      Object.values(modals).forEach(m => m.classList.remove('open'));
      modals[name].classList.add('open');
      modalOverlayEl.classList.add('open');
      burgerMenuEl.classList.remove('open');
      if(name === 'faq') renderFaq(currentLang);
      if(name === 'partners') renderPartners(currentLang);
    }
    function closeModal(){
      modalOverlayEl.classList.remove('open');
      Object.values(modals).forEach(m => m.classList.remove('open'));
    }

    document.querySelectorAll('.burger-menu-item-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        openModal(btn.dataset.modal);
      });
    });
    document.querySelectorAll('[data-close]').forEach(btn=>{
      btn.addEventListener('click', closeModal);
    });
    modalOverlayEl.addEventListener('click', (e)=>{
      if(e.target === modalOverlayEl) closeModal();
    });


    // ===================== CATALOG LOGIC =====================


    // ===================== CATALOG LOGIC (v2 — данные из JSON, постраничный вывод) =====================
    let ALL_ROSES = [];
    let currentLang = 'et';
    let currentFilters = { types:new Set(), colors:new Set(), fragranceYes:false, fragranceNo:false, priceMin:null, priceMax:null, inStock:false };
    let currentSort = 'name-asc';
    let currentSearch = '';
    const PAGE_SIZE = 24;
    let visibleCount = PAGE_SIZE;

    function heightSortKey(str){
      const m = String(str).replace(',', '.').match(/[\d.]+/);
      return m ? parseFloat(m[0]) : 0;
    }

    function buildFilterOptions(){
      const typeBox = document.getElementById('filterType');
      const colorBox = document.getElementById('filterColor');
      typeBox.innerHTML = '';
      colorBox.innerHTML = '';
      const types = Array.from(new Set(ALL_ROSES.map(r => r.type[currentLang]).filter(Boolean)));
      const colors = Array.from(new Set(ALL_ROSES.flatMap(r => r.color[currentLang]).filter(Boolean)));
      types.forEach(t => {
        const id = 'type_' + t.replace(/\W+/g,'_');
        const label = document.createElement('label');
        label.className = 'filter-option';
        label.innerHTML = `<input type="checkbox" data-type="${t}" id="${id}"><span>${t}</span>`;
        typeBox.appendChild(label);
      });
      colors.forEach(c => {
        const id = 'color_' + c.replace(/\W+/g,'_');
        const label = document.createElement('label');
        label.className = 'filter-option';
        label.innerHTML = `<input type="checkbox" data-color="${c}" id="${id}"><span>${c}</span>`;
        colorBox.appendChild(label);
      });
      typeBox.querySelectorAll('input').forEach(cb => cb.addEventListener('change', onFilterChange));
      colorBox.querySelectorAll('input').forEach(cb => cb.addEventListener('change', onFilterChange));
    }

    function onFilterChange(){
      currentFilters.types = new Set(Array.from(document.querySelectorAll('#filterType input:checked')).map(i=>i.dataset.type));
      currentFilters.colors = new Set(Array.from(document.querySelectorAll('#filterColor input:checked')).map(i=>i.dataset.color));
      currentFilters.fragranceYes = document.getElementById('filterFragranceYes').checked;
      currentFilters.fragranceNo = document.getElementById('filterFragranceNo').checked;
      currentFilters.inStock = document.getElementById('filterInStock').checked;
      const pmin = document.getElementById('priceMin').value;
      const pmax = document.getElementById('priceMax').value;
      currentFilters.priceMin = pmin ? parseFloat(pmin) : null;
      currentFilters.priceMax = pmax ? parseFloat(pmax) : null;
      visibleCount = PAGE_SIZE;
      renderGrid();
    }

    function applyFilters(list){
      return list.filter(r => {
        if(currentSearch){
          const nameMatch = r.name.toLowerCase().includes(currentSearch);
          const aliasMatch = (r.searchAliases||[]).some(a => a.toLowerCase().includes(currentSearch));
          if(!nameMatch && !aliasMatch) return false;
        }
        if(currentFilters.types.size && !currentFilters.types.has(r.type[currentLang])) return false;
        if(currentFilters.colors.size && !r.color[currentLang].some(c => currentFilters.colors.has(c))) return false;
        if(currentFilters.fragranceYes && !currentFilters.fragranceNo && !r.fragrance) return false;
        if(currentFilters.fragranceNo && !currentFilters.fragranceYes && r.fragrance) return false;
        if(currentFilters.priceMin !== null && r.price < currentFilters.priceMin) return false;
        if(currentFilters.priceMax !== null && r.price > currentFilters.priceMax) return false;
        if(currentFilters.inStock && r.stock <= 0) return false;
        return true;
      });
    }

    function applySort(list){
      const sorted = list.slice();
      sorted.sort((a,b)=>{
        const groupDiff = (a.isKit?1:0) - (b.isKit?1:0);
        if(groupDiff !== 0) return groupDiff;
        switch(currentSort){
          case 'name-asc': return a.name.localeCompare(b.name);
          case 'name-desc': return b.name.localeCompare(a.name);
          case 'price-asc': return a.price - b.price;
          case 'price-desc': return b.price - a.price;
          case 'height-asc': return heightSortKey(a.height) - heightSortKey(b.height);
          case 'height-desc': return heightSortKey(b.height) - heightSortKey(a.height);
          default: return 0;
        }
      });
      return sorted;
    }

    function renderGrid(){
      const grid = document.getElementById('roseGrid');
      const filtered = applySort(applyFilters(ALL_ROSES));
      const t = translations[currentLang];
      document.getElementById('catalogCount').textContent = filtered.length + ' ' + t.catalogCount;
      grid.innerHTML = '';

      if(!filtered.length){
        const empty = document.createElement('div');
        empty.className = 'catalog-empty-state';
        empty.textContent = t.noResults;
        grid.appendChild(empty);
        document.getElementById('showMoreWrap').style.display = 'none';
        return;
      }

      const toShow = filtered.slice(0, visibleCount);
      toShow.forEach(r => {
        const t2 = translations[currentLang];
        const displayName = r.isKit && r.nameByLang ? (r.nameByLang[currentLang] || r.name) : r.name;
        const priceHtml = r.price ? `${Number(r.price).toFixed(2)} €` : `<span class="price-on-request">${t2.priceOnRequest}</span>`;
        const priceBlock = r.isKit ? '' : `<div class="rose-card-price">${priceHtml}</div>`;
        const preorderHtml = r.preorder ? `<span class="preorder-badge card-badge">${t2.preorderBadge}</span>` : '';
        const card = document.createElement('a');
        card.href = r.url;
        card.className = 'rose-card';
        card.innerHTML = `
          <div class="rose-card-photo">
            <img src="${r.thumb}" alt="${displayName}" loading="lazy">
            <div class="rose-card-cart">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            </div>
            ${preorderHtml}
          </div>
          <div class="rose-card-body">
            <div class="rose-card-name">${displayName}</div>
            <div class="rose-card-type">${r.type[currentLang]}</div>
            ${priceBlock}
          </div>
        `;
        grid.appendChild(card);
      });

      const showMoreWrap = document.getElementById('showMoreWrap');
      if(visibleCount < filtered.length){
        showMoreWrap.style.display = 'block';
        document.getElementById('showMoreBtn').textContent = t.showMore;
      } else {
        showMoreWrap.style.display = 'none';
      }
    }

    document.getElementById('showMoreBtn').addEventListener('click', ()=>{
      visibleCount += PAGE_SIZE;
      renderGrid();
    });

    const searchInputEl = document.getElementById('searchInput');
    if(searchInputEl){
      searchInputEl.addEventListener('input', (e)=>{
        currentSearch = e.target.value.trim().toLowerCase();
        visibleCount = PAGE_SIZE;
        renderGrid();
      });
    }

    // ===== Голосовой поиск (Web Speech API) =====
    const voiceBtn = document.getElementById('voiceSearchBtn');
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(voiceBtn && SpeechRecognitionCtor && searchInputEl){
      voiceBtn.hidden = false;
      const recognition = new SpeechRecognitionCtor();
      recognition.continuous = false;
      recognition.interimResults = false;

      const langMap = { et: 'et-EE', ru: 'ru-RU', en: 'en-US' };

      voiceBtn.addEventListener('click', ()=>{
        recognition.lang = langMap[currentLang] || 'et-EE';
        try{
          recognition.start();
          voiceBtn.classList.add('listening');
        }catch(e){ /* уже слушает — игнорируем */ }
      });
      recognition.addEventListener('result', (e)=>{
        const text = e.results[0][0].transcript;
        searchInputEl.value = text;
        currentSearch = text.trim().toLowerCase();
        visibleCount = PAGE_SIZE;
        renderGrid();
      });
      recognition.addEventListener('end', ()=>{
        voiceBtn.classList.remove('listening');
      });
      recognition.addEventListener('error', ()=>{
        voiceBtn.classList.remove('listening');
      });
    }

    document.getElementById('priceMin').addEventListener('input', onFilterChange);
    document.getElementById('priceMax').addEventListener('input', onFilterChange);
    document.getElementById('filterInStock').addEventListener('change', onFilterChange);
    document.getElementById('filterFragranceYes').addEventListener('change', onFilterChange);
    document.getElementById('filterFragranceNo').addEventListener('change', onFilterChange);

    document.getElementById('filterReset').addEventListener('click', ()=>{
      document.querySelectorAll('#filterType input, #filterColor input, #filterFragranceYes, #filterFragranceNo, #filterInStock').forEach(i=>i.checked=false);
      document.getElementById('priceMin').value = '';
      document.getElementById('priceMax').value = '';
      currentFilters = { types:new Set(), colors:new Set(), fragranceYes:false, fragranceNo:false, priceMin:null, priceMax:null, inStock:false };
      visibleCount = PAGE_SIZE;
      renderGrid();
    });

    document.getElementById('sortSelect').addEventListener('change', (e)=>{
      currentSort = e.target.value;
      visibleCount = PAGE_SIZE;
      renderGrid();
    });

    document.getElementById('filtersToggle').addEventListener('click', ()=>{
      document.getElementById('filtersPanel').classList.toggle('open');
      document.getElementById('filtersToggle').classList.toggle('open');
    });

    function refreshCatalogLang(lang){
      currentLang = lang;
      buildFilterOptions();
      renderGrid();
      if(typeof renderAccessories === 'function') renderAccessories();
      if(modalFaqBox && modalFaqBox.classList.contains('open')) renderFaq(lang);
      if(modalPartnersBox && modalPartnersBox.classList.contains('open')) renderPartners(lang);
    }

    const logoHomeEl = document.getElementById('logoHome');
    if(logoHomeEl){
      logoHomeEl.addEventListener('click', (e)=>{
        e.preventDefault();
        window.scrollTo({top:0, behavior:'smooth'});
      });
    }

    // ===== Загрузка данных каталога (розы + наборы — единый каталог) =====
    Promise.all([
      fetch('data/roses.json').then(res => res.json()),
      fetch('data/kits.json').then(res => res.ok ? res.json() : []).catch(()=>[]),
    ])
      .then(([roses, kits]) => {
        ALL_ROSES = roses.concat(kits);
        buildFilterOptions();
        renderGrid();
      })
      .catch(err => {
        document.getElementById('roseGrid').innerHTML =
          '<div class="catalog-empty-state">Ошибка загрузки каталога. Обновите страницу или свяжитесь с нами.</div>';
        console.error('Не удалось загрузить каталог', err);
      });

    // ===== Товары для ухода (допродажи) — отдельный блок, переводится при смене языка =====
    let ALL_ACCESSORIES = [];
    function renderAccessories(){
      if(!ALL_ACCESSORIES.length) return;
      document.getElementById('accessoriesSection').style.display = 'block';
      const grid = document.getElementById('accessoriesGrid');
      grid.innerHTML = '';
      ALL_ACCESSORIES.forEach(a => {
        const priceHtml = a.price ? `${Number(a.price).toFixed(2)} €` : `<span class="price-on-request">${translations[currentLang].priceOnRequest}</span>`;
        const card = document.createElement('a');
        card.href = a.url;
        card.className = 'rose-card';
        card.innerHTML = `
          <div class="rose-card-photo">
            <img src="${a.thumb}" alt="${a.name}" loading="lazy">
          </div>
          <div class="rose-card-body">
            <div class="rose-card-name">${a.name}</div>
            <div class="rose-card-type">${a.category || ''}</div>
            <div class="rose-card-price">${priceHtml}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }
    fetch('data/accessories.json')
      .then(res => res.ok ? res.json() : [])
      .then(data => {
        ALL_ACCESSORIES = data || [];
        renderAccessories();
      })
      .catch(()=>{});

    setLang(localStorage.getItem('reinjoost_lang') || 'et');
  </script>
